<script>
function preprocessImage(imageURL) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => {

      try {

        const ctx = canvas.getContext(
          "2d",
          { willReadFrequently: true }
        );

        /*
          Förstora bilden så att liten text
          blir lättare för OCR att läsa.
        */

        let scale = 2.5;

        const maxWidth = 2800;

        if (img.width * scale > maxWidth) {
          scale = maxWidth / img.width;
        }

        canvas.width =
          Math.round(img.width * scale);

        canvas.height =
          Math.round(img.height * scale);

        /*
          Vit bakgrund först.
        */

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imageData =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );

        const data =
          imageData.data;

        /*
          Dokumentbehandling:
          - gråskala
          - högre kontrast
          - svart/vit tröskel
        */

        for (
          let i = 0;
          i < data.length;
          i += 4
        ) {

          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

          /*
            Öka kontrasten.
          */

          gray =
            (gray - 128) * 1.7 + 128;

          gray =
            Math.max(
              0,
              Math.min(
                255,
                gray
              )
            );

          /*
            Gör bilden svart/vit.
            Text blir svart och
            papper blir vitt.
          */

          const threshold = 175;

          const value =
            gray < threshold
              ? 0
              : 255;

          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
        }

        ctx.putImageData(
          imageData,
          0,
          0
        );

        /*
          PNG är bättre än JPEG här,
          eftersom JPEG kan skapa små
          artefakter runt bokstäver.
        */

        resolve(
          canvas.toDataURL(
            "image/png"
          )
        );

      } catch (error) {

        reject(error);

      }
    };

    img.onerror = reject;

    img.src = imageURL;
  });
}
</script>
