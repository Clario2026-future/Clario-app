<!DOCTYPE html>

<html lang="sv">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Clario</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f4f7fb;

      color: #1f2937;

    }

    .app {

      max-width: 600px;

      margin: 0 auto;

      padding: 24px 18px;

    }

    h1 {

      text-align: center;

      color: #2563eb;

      margin-bottom: 6px;

    }

    .subtitle {

      text-align: center;

      color: #6b7280;

      margin-bottom: 28px;

    }

    .card {

      background: white;

      border-radius: 18px;

      padding: 20px;

      box-shadow: 0 4px 18px rgba(0,0,0,0.08);

      margin-bottom: 18px;

    }

    button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 16px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;

    }

    .camera {

      background: #2563eb;

      color: white;

    }

    .translate {

      background: #16a34a;

      color: white;

    }

    .simple {

      background: #f59e0b;

      color: white;

    }

    select {

      width: 100%;

      padding: 14px;

      border-radius: 12px;

      border: 1px solid #d1d5db;

      font-size: 16px;

      margin-top: 8px;

    }

    img {

      width: 100%;

      margin-top: 15px;

      border-radius: 14px;

      display: none;

    }

    textarea {

      width: 100%;

      min-height: 180px;

      box-sizing: border-box;

      border-radius: 12px;

      border: 1px solid #d1d5db;

      padding: 14px;

      font-size: 16px;

      resize: vertical;

    }

    #fileInput {

      display: none;

    }

    .status {

      text-align: center;

      color: #6b7280;

      margin-top: 12px;

    }

  </style>

</head>

<body>

  <div class="app">

    <h1>Clario</h1>

    <div class="subtitle">Förstå dokument på ditt språk</div>

    <div class="card">

      <h2>1. Ta kort på dokumentet</h2>

      <input

        type="file"

        id="fileInput"

        accept="image/*"

        capture="environment"

      />

      <button class="camera" onclick="openCamera()">

        📷 Ta kort

      </button>

      <img id="preview" alt="Förhandsvisning" />

    </div>

    <div class="card">

      <h2>2. Välj språk</h2>

      <select id="language">

        <option value="English">Engelska</option>

        <option value="Arabic">Arabiska</option>

        <option value="Somali">Somaliska</option>

        <option value="Persian">Persiska</option>

        <option value="Ukrainian">Ukrainska</option>

        <option value="Spanish">Spanska</option>

        <option value="German">Tyska</option>

        <option value="French">Franska</option>

      </select>

      <button class="translate" onclick="translateDocument()">

        🌍 Översätt dokument

      </button>

      <button class="simple" onclick="simplifySwedish()">

        ✨ Förklara på enklare svenska

      </button>

      <p class="status" id="status"></p>

    </div>

    <div class="card">

      <h2>Resultat</h2>

      <textarea

        id="result"

        placeholder="Den översatta eller förenklade texten visas här..."

      ></textarea>

    </div>

  </div>

  <script>

    const fileInput = document.getElementById("fileInput");

    const preview = document.getElementById("preview");

    const statusText = document.getElementById("status");

    function openCamera() {

      fileInput.click();

    }

    fileInput.addEventListener("change", function () {

      const file = fileInput.files[0];

      if (!file) return;

      preview.src = URL.createObjectURL(file);

      preview.style.display = "block";

      statusText.textContent = "Bild vald ✓";

    });

    function translateDocument() {

      if (!fileInput.files[0]) {

        alert("Ta först ett kort på dokumentet.");

        return;

      }

      const language = document.getElementById("language").value;

      statusText.textContent =

        "Bilden är klar. Nästa steg är att koppla AI-översättningen till " +

        language +

        ".";

    }

    function simplifySwedish() {

      if (!fileInput.files[0]) {

        alert("Ta först ett kort på dokumentet.");

        return;

      }

      statusText.textContent =

        "Bilden är klar. Nästa steg är att koppla AI för enklare svenska.";

    }

  </script>

</body>

</html>
