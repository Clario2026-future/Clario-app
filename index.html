<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Clario</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(
        135deg,
        #246bfd,
        #59c4e8
      );

      color: white;
      padding: 35px 20px 28px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.95;
    }

    main {
      padding: 25px 20px;
    }

    .language-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 16px;

      border: 1px solid #d1d5db;
      border-radius: 18px;

      background: white;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      min-height: 190px;

      resize: vertical;

      padding: 18px;

      font-size: 18px;
      line-height: 1.45;

      border: 1px solid #d1d5db;
      border-radius: 20px;

      outline: none;
    }

    textarea:focus {
      border-color: #246bfd;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 20px;

      padding: 18px;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .translate-btn {
      margin-top: 18px;
      background: #2f6ff7;
      color: white;
    }

    .camera-btn {
      margin-top: 18px;

      background: #f1f5ff;
      color: #246bfd;

      border: 3px solid #246bfd;
    }

    #cameraInput {
      display: none;
    }

    #preview {
      width: 100%;
      margin-top: 25px;
      border-radius: 20px;
      display: none;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      min-height: 24px;
    }

    .result-title {
      margin-top: 28px;
      font-size: 22px;
      font-weight: bold;
    }

    .result {
      margin-top: 10px;

      padding: 20px;

      min-height: 120px;

      background: #f4f7fb;

      border-radius: 20px;

      font-size: 18px;
      line-height: 1.55;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .progress {
      width: 100%;
      height: 8px;

      background: #e5e7eb;

      border-radius: 10px;

      margin-top: 15px;

      overflow: hidden;

      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;

      background: #246bfd;

      transition: width 0.2s;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Clario</h1>
    <p>Fotografera, läs och översätt dokument</p>
  </header>

  <main>

    <div class="language-row">

      <div>
        <label for="fromLang">
          Från
        </label>

        <select id="fromLang">
          <option value="sv" selected>
            Svenska
          </option>

          <option value="en">
            Engelska
          </option>

          <option value="de">
            Tyska
          </option>

          <option value="fr">
            Franska
          </option>

          <option value="es">
            Spanska
          </option>

          <option value="it">
            Italienska
          </option>

          <option value="ar">
            Arabiska
          </option>
        </select>
      </div>

      <div>
        <label for="toLang">
          Till
        </label>

        <select id="toLang">
          <option value="en" selected>
            Engelska
          </option>

          <option value="sv">
            Svenska
          </option>

          <option value="de">
            Tyska
          </option>

          <option value="fr">
            Franska
          </option>

          <option value="es">
            Spanska
          </option>

          <option value="it">
            Italienska
          </option>

          <option value="ar">
            Arabiska
          </option>
        </select>
      </div>

    </div>

    <label for="inputText">
      Text eller dokument
    </label>

    <textarea
      id="inputText"
      placeholder="Skriv text här eller fotografera ett dokument..."
    ></textarea>

    <button
      id="translateButton"
      class="translate-btn"
      onclick="translateText()"
    >
      🌍 Översätt
    </button>

    <button
      id="cameraButton"
      class="camera-btn"
      onclick="document.getElementById('cameraInput').click()"
    >
      📷 Ta kort på dokument
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <div
      class="progress"
      id="progress"
    >
      <div
        class="progress-bar"
        id="progressBar"
      ></div>
    </div>

    <div
      id="statusText"
      class="status"
    ></div>

    <img
      id="preview"
      alt="Dokument"
    >

    <canvas id="canvas"></canvas>

    <div class="result-title">
      Översättning
    </div>

    <div
      id="result"
      class="result"
    ></div>

  </main>

</div>

<script>

const inputText =
  document.getElementById("inputText");

const result =
  document.getElementById("result");

const statusText =
  document.getElementById("statusText");

const cameraInput =
  document.getElementById("cameraInput");

const preview =
  document.getElementById("preview");

const canvas =
  document.getElementById("canvas");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");

const translateButton =
  document.getElementById("translateButton");

const cameraButton =
  document.getElementById("cameraButton");


cameraInput.addEventListener(
  "change",
  handleImage
);


async function handleImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  const imageURL =
    URL.createObjectURL(file);

  preview.src =
    imageURL;

  preview.style.display =
    "block";

  inputText.value =
    "";

  result.innerText =
    "";

  cameraButton.disabled =
    true;

  translateButton.disabled =
    true;

  statusText.innerText =
    "📄 Förbereder dokument...";

  progress.style.display =
    "block";

  progressBar.style.width =
    "2%";

  try {

    const parts =
      await preprocessAndSplitImage(
        imageURL
      );

    let allParts =
      [];

    const totalParts =
      parts.length;

    for (
      let i = 0;
      i < totalParts;
      i++
    ) {

      const partNumber =
        i + 1;

      statusText.innerText =
        "🔎 Läser del " +
        partNumber +
        " av " +
        totalParts +
        "...";


      const firstResult =
        await Tesseract.recognize(
          parts[i],
          "swe+eng",
          {
            tessedit_pageseg_mode: 6,
            preserve_interword_spaces: "1",

            logger: message => {

              if (
                message.status ===
                "recognizing text"
              ) {

                const localProgress =
                  message.progress || 0;

                const totalProgress =
                  (
                    i +
                    localProgress
                  ) /
                  totalParts;

                const percent =
                  Math.min(
                    94,
                    Math.round(
                      totalProgress *
                      94
                    )
                  );

                progressBar.style.width =
                  percent + "%";

                statusText.innerText =
                  "🔎 Läser del " +
                  partNumber +
                  " av " +
                  totalParts +
                  " - " +
                  percent +
                  "%";
              }
            }
          }
        );


      statusText.innerText =
        "🔍 Kontrollerar del " +
        partNumber +
        " av " +
        totalParts +
        "...";


      const secondResult =
        await Tesseract.recognize(
          parts[i],
          "swe+eng",
          {
            tessedit_pageseg_mode: 3,
            preserve_interword_spaces: "1"
          }
        );


      const firstText =
        cleanOCRText(
          firstResult.data.text
        );

      const secondText =
        cleanOCRText(
          secondResult.data.text
        );


      const chosenText =
        chooseBestOCR(
          firstText,
          secondText
        );


      if (
        chosenText
      ) {

        allParts.push(
          chosenText
        );
      }
    }


    let fullText =
      mergeOCRParts(
        allParts
      );


    fullText =
      cleanOCRText(
        fullText
      );


    inputText.value =
      fullText;


    progressBar.style.width =
      "100%";


    if (
      fullText.length >
      10
    ) {

      statusText.innerText =
        "✅ Dokumentet är avläst";

    } else {

      statusText.innerText =
        "⚠️ Väldigt lite text hittades";
    }


    setTimeout(
      () => {

        progress.style.display =
          "none";

      },
      700
    );


  } catch (error) {

    console.error(
      "OCR ERROR:",
      error
    );

    statusText.innerText =
      "❌ Kunde inte läsa dokumentet";

    progress.style.display =
      "none";

  } finally {

    cameraButton.disabled =
      false;

    translateButton.disabled =
      false;

    cameraInput.value =
      "";

    URL.revokeObjectURL(
      imageURL
    );
  }
}



function preprocessAndSplitImage(
  imageURL
) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();


      img.onload = () => {

        try {

          const ctx =
            canvas.getContext(
              "2d",
              {
                willReadFrequently: true
              }
            );


          let scale =
            2;


          const maxWidth =
            2600;


          if (
            img.width * scale >
            maxWidth
          ) {

            scale =
              maxWidth /
              img.width;
          }


          canvas.width =
            Math.round(
              img.width *
              scale
            );


          canvas.height =
            Math.round(
              img.height *
              scale
            );


          ctx.fillStyle =
            "#ffffff";


          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          const imageData =
            ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height
            );


          const data =
            imageData.data;


          for (
            let i = 0;
            i < data.length;
            i += 4
          ) {

            const r =
              data[i];

            const g =
              data[i + 1];

            const b =
              data[i + 2];


            let gray =
              0.299 * r +
              0.587 * g +
              0.114 * b;


            gray =
              (gray - 128) *
              1.35 +
              128;


            gray =
              Math.max(
                0,
                Math.min(
                  255,
                  gray
                )
              );


            if (
              gray > 225
            ) {

              gray =
                255;
            }


            data[i] =
              gray;

            data[i + 1] =
              gray;

            data[i + 2] =
              gray;
          }


          ctx.putImageData(
            imageData,
            0,
            0
          );


          const parts =
            [];


          const imageHeight =
            canvas.height;


          const imageWidth =
            canvas.width;


          let numberOfParts =
            2;


          if (
            imageHeight >
            imageWidth *
            1.8
          ) {

            numberOfParts =
              3;
          }


          if (
            imageHeight >
            imageWidth *
            3
          ) {

            numberOfParts =
              4;
          }


          if (
            imageHeight >
            imageWidth *
            4.5
          ) {

            numberOfParts =
              5;
          }


          const overlap =
            Math.round(
              imageHeight *
              0.012
            );


          const basePartHeight =
            Math.ceil(
              imageHeight /
              numberOfParts
            );


          for (
            let partIndex = 0;
            partIndex <
            numberOfParts;
            partIndex++
          ) {

            let startY =
              partIndex *
              basePartHeight;


            let endY =
              Math.min(
                imageHeight,
                startY +
                basePartHeight
              );


            if (
              partIndex > 0
            ) {

              startY =
                Math.max(
                  0,
                  startY -
                  overlap
                );
            }


            if (
              partIndex <
              numberOfParts - 1
            ) {

              endY =
                Math.min(
                  imageHeight,
                  endY +
                  overlap
                );
            }


            const partHeight =
              endY -
              startY;


            const partCanvas =
              document.createElement(
                "canvas"
              );


            partCanvas.width =
              imageWidth;


            partCanvas.height =
              partHeight;


            const partCtx =
              partCanvas.getContext(
                "2d"
              );


            partCtx.fillStyle =
              "#ffffff";


            partCtx.fillRect(
              0,
              0,
              imageWidth,
              partHeight
            );


            partCtx.drawImage(
              canvas,

              0,
              startY,
              imageWidth,
              partHeight,

              0,
              0,
              imageWidth,
              partHeight
            );


            parts.push(
              partCanvas.toDataURL(
                "image/jpeg",
                0.95
              )
            );
          }


          resolve(
            parts
          );


        } catch (error) {

          reject(
            error
          );
        }
      };


      img.onerror =
        reject;


      img.src =
        imageURL;
    }
  );
}



function cleanOCRText(text) {

  if (!text) {
    return "";
  }


  let cleaned =
    text

      .replace(
        /\r/g,
        ""
      )

      .replace(
        /[|¦]+/g,
        "I"
      )

      .replace(
        /[“”]/g,
        '"'
      )

      .replace(
        /[‘’]/g,
        "'"
      )

      .replace(
        /[ \t]+/g,
        " "
      )

      .replace(
        / +\n/g,
        "\n"
      )

      .replace(
        /\n +/g,
        "\n"
      )

      .replace(
        /\s+([,.!?;:])/g,
        "$1"
      );


  let lines =
    cleaned
      .split("\n")
      .map(
        line =>
          line.trim()
      )
      .filter(
        line =>
          line.length > 0
      );


  lines =
    lines.filter(
      line => {

        if (
          line.length <= 2 &&
          !/\d/.test(line)
        ) {

          return false;
        }


        const letters =
          (
            line.match(
              /\p{L}/gu
            ) ||
            []
          ).length;


        const numbers =
          (
            line.match(
              /\d/g
            ) ||
            []
          ).length;


        const strange =
          (
            line.match(
              /[^\p{L}\p{N}\s.,:;!?()\/@+\-%–—'"#&]/gu
            ) ||
            []
          ).length;


        if (
          strange >
          line.length *
          0.25
        ) {

          return false;
        }


        const words =
          line
            .split(
              /\s+/
            )
            .filter(Boolean);


        const tinyWords =
          words.filter(
            word =>
              word.length <= 2
          ).length;


        if (
          words.length >= 5 &&
          tinyWords /
          words.length >
          0.7 &&
          numbers === 0
        ) {

          return false;
        }


        if (
          letters === 0 &&
          numbers === 0
        ) {

          return false;
        }


        return true;
      }
    );


  const finalLines =
    [];


  let previous =
    "";


  for (
    const line of lines
  ) {

    const normalized =
      line
        .toLowerCase()
        .replace(
          /\s+/g,
          " "
        );


    if (
      normalized ===
      previous
    ) {

      continue;
    }


    finalLines.push(
      line
    );


    previous =
      normalized;
  }


  return finalLines
    .join("\n")
    .replace(
      /\n{3,}/g,
      "\n\n"
    )
    .trim();
}



function chooseBestOCR(
  first,
  second
) {

  const scoreText =
    text => {

      if (!text) {
        return 0;
      }


      const letters =
        (
          text.match(
            /\p{L}/gu
          ) ||
          []
        ).length;


      const digits =
        (
          text.match(
            /\d/g
          ) ||
          []
        ).length;


      const usefulLines =
        text
          .split("\n")
          .filter(
            line =>
              line.trim()
                .length >=
              4
          )
          .length;


      const suspiciousLines =
        text
          .split("\n")
          .filter(
            line => {

              const words =
                line
                  .trim()
                  .split(
                    /\s+/
                  )
                  .filter(Boolean);


              if (
                words.length <
                4
              ) {

                return false;
              }


              const shortWords =
                words.filter(
                  word =>
                    word.length <= 2
                ).length;


              return (
                shortWords /
                words.length >
                0.7
              );
            }
          )
          .length;


      return (
        letters +
        digits *
        0.8 +
        usefulLines *
        6 -
        suspiciousLines *
        15
      );
    };


  const scoreFirst =
    scoreText(
      first
    );


  const scoreSecond =
    scoreText(
      second
    );


  return scoreSecond >
    scoreFirst
      ? second
      : first;
}



function normalizeOCRLine(
  line
) {

  return line
    .toLowerCase()
    .replace(
      /[^\p{L}\p{N}]/gu,
      ""
    );
}



function mergeOCRParts(
  parts
) {

  const resultLines =
    [];


  for (
    const part of parts
  ) {

    const lines =
      part
        .split("\n")
        .map(
          line =>
            line.trim()
        )
        .filter(Boolean);


    for (
      const line of lines
    ) {

      const normalized =
        normalizeOCRLine(
          line
        );


      if (
        normalized.length <
        2
      ) {

        continue;
      }


      const recentLines =
        resultLines.slice(
          -10
        );


      const alreadyExists =
        recentLines.some(
          oldLine => {

            const oldNormalized =
              normalizeOCRLine(
                oldLine
              );


            if (
              normalized ===
              oldNormalized
            ) {

              return true;
            }


            if (
              normalized.length >= 15 &&
              oldNormalized.length >= 15
            ) {

              if (
                normalized.includes(
                  oldNormalized
                ) ||
                oldNormalized.includes(
                  normalized
                )
              ) {

                return true;
              }
            }


            return false;
          }
        );


      if (
        !alreadyExists
      ) {

        resultLines.push(
          line
        );
      }
    }
  }


  return resultLines
    .join("\n");
}



function splitText(
  text,
  maxLength = 450
) {

  const pieces =
    [];


  let remaining =
    text.trim();


  while (
    remaining.length >
    maxLength
  ) {

    let cut =
      remaining.lastIndexOf(
        ". ",
        maxLength
      );


    if (
      cut < 100
    ) {

      cut =
        remaining.lastIndexOf(
          "\n",
          maxLength
        );
    }


    if (
      cut < 100
    ) {

      cut =
        remaining.lastIndexOf(
          " ",
          maxLength
        );
    }


    if (
      cut < 100
    ) {

      cut =
        maxLength;
    }


    pieces.push(
      remaining
        .slice(
          0,
          cut + 1
        )
        .trim()
    );


    remaining =
      remaining
        .slice(
          cut + 1
        )
        .trim();
  }


  if (
    remaining
  ) {

    pieces.push(
      remaining
    );
  }


  return pieces;
}



async function translateText() {

  const text =
    inputText.value.trim();


  const from =
    document
      .getElementById(
        "fromLang"
      )
      .value;


  const to =
    document
      .getElementById(
        "toLang"
      )
      .value;


  if (!text) {

    alert(
      "Skriv en text eller ta kort på ett dokument först."
    );

    return;
  }


  if (
    from === to
  ) {

    result.innerText =
      text;

    statusText.innerText =
      "✅ Texten är redan på valt språk";

    return;
  }


  translateButton.disabled =
    true;

  cameraButton.disabled =
    true;


  statusText.innerText =
    "🌍 Översätter...";


  result.innerText =
    "Översätter...";


  try {

    const chunks =
      splitText(
        text,
        450
      );


    let translatedParts =
      [];


    for (
      let i = 0;
      i <
      chunks.length;
      i++
    ) {

      statusText.innerText =
        "🌍 Översätter del " +
        (i + 1) +
        " av " +
        chunks.length +
        "...";


      const chunk =
        chunks[i];


      const url =

        "https://api.mymemory.translated.net/get?q=" +

        encodeURIComponent(
          chunk
        ) +

        "&langpair=" +

        encodeURIComponent(
          from +
          "|" +
          to
        );


      const response =
        await fetch(
          url
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP-fel från översättningstjänsten: " +
          response.status
        );
      }


      const data =
        await response.json();


      if (
        !data.responseData ||
        !data.responseData
          .translatedText
      ) {

        throw new Error(
          "Översättning saknas i API-svaret"
        );
      }


      let translated =
        data.responseData
          .translatedText
          .trim();


      if (
        translated
          .toLowerCase() ===
        chunk
          .toLowerCase() &&

        Array.isArray(
          data.matches
        )
      ) {

        const betterMatch =
          data.matches.find(
            item =>

              item.translation &&

              item.translation
                .toLowerCase() !==
              chunk
                .toLowerCase()
          );


        if (
          betterMatch
        ) {

          translated =
            betterMatch
              .translation
              .trim();
        }
      }


      translatedParts.push(
        translated
      );
    }


    let translatedText =
      translatedParts
        .join("\n\n")
        .replace(
          /\s+([,.!?;:])/g,
          "$1"
        )
        .replace(
          /\n{3,}/g,
          "\n\n"
        )
        .trim();


    if (
      !translatedText
    ) {

      throw new Error(
        "Ingen översättning kunde skapas"
      );
    }


    result.innerText =
      translatedText;


    statusText.innerText =
      "✅ Översättning klar";


  } catch (error) {

    console.error(
      "TRANSLATION ERROR:",
      error
    );


    result.innerText =

      "Översättningen kunde inte genomföras.\n\n" +

      error.message;


    statusText.innerText =
      "❌ Översättningen misslyckades";

  } finally {

    translateButton.disabled =
      false;

    cameraButton.disabled =
      false;
  }
}

</script>

</body>
</html>
